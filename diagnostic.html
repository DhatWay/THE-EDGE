<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDGE — Diagnostic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#C9A84C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script src="power-engine.js"></script>
  <script src="algorithms.js"></script>
  <script src="governor.js"></script>
  <script src="physics.js"></script>
  <script src="claude.js"></script>
  <script src="context-builder.js"></script>
  <script src="roster-engine.js"></script>
  <script src="roster-enrichment.js"></script>
  <script src="injury-fragmentation.js"></script>
  <script src="ats-tracker.js"></script>
  <script src="orchestrator.js"></script>
  <script src="learning.js"></script>
  <script src="parlay.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C; --gold-dim: #8A6E2F;
      --bg: #080808; --bg2: #0F0F0F; --bg4: #1C1C1C;
      --surface: #111111; --border: rgba(201,168,76,0.12);
      --text: #F0EAD8; --text-dim: #7A7060; --text-mid: #A89878;
      --green: #27AE60; --red: #E74C3C; --blue: #4A90D9;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 60px; background: rgba(8,8,8,0.97); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); display: flex; align-items: center; padding: 0 20px; }
    .logo-mark { width: 34px; height: 34px; background: var(--gold); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 16px; display: flex; align-items: center; justify-content: center; clip-path: polygon(15% 0%,85% 0%,100% 15%,100% 85%,85% 100%,15% 100%,0% 85%,0% 15%); }
    .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 5px; color: var(--gold); line-height: 1; margin-left: 10px; }
    main { padding-top: 60px; }
    .header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; }
    .title em { color: var(--gold); font-style: normal; }
    .btn-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { background: var(--gold); border: none; color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 2px; padding: 9px 16px; cursor: pointer; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.secondary { background: none; border: 1px solid var(--border); color: var(--text-mid); }
    .status { padding: 10px 20px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--bg2); }
    .status.active { color: var(--gold); }
    pre { padding: 16px 20px 80px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; line-height: 1.6; color: var(--text-mid); white-space: pre-wrap; word-break: break-word; }
    .section-title { color: var(--gold); font-weight: 700; }
    .ok { color: var(--green); }
    .err { color: var(--red); font-weight: 700; }
    .warn { color: var(--gold); }
    .info { color: var(--blue); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--green); color: #000; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 10px 24px; z-index: 200; opacity: 0; transition: all 0.3s; white-space: nowrap; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--red); color: #fff; }
  </style>
</head>
<body>

  <nav>
    <div class="logo-mark">ED</div>
    <div class="logo-text">EDGE · DIAGNOSTIC</div>
  </nav>

  <main>
    <div class="header">
      <div class="title">FULL <em>DIAGNOSTIC</em></div>
      <div class="btn-bar">
        <button class="btn" id="verifyBtn" onclick="runVerify()">✓ VERIFY DEPLOY</button>
        <button class="btn" id="runBtn" onclick="runAll()">▶ FULL RUN</button>
        <button class="btn secondary" id="copyBtn" onclick="copyAll()">⧉ COPY ALL</button>
        <button class="btn secondary" id="purgeBtn" onclick="purgeCache()">⟳ PURGE CACHE</button>
      </div>
    </div>

    <div class="status" id="status">Idle — tap RUN</div>

    <pre id="output">Output appears here after RUN.</pre>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const lines = [];
    const out = (text = '', cls = '') => { lines.push({ text, cls }); };
    const render = () => {
      document.getElementById('output').innerHTML = lines.map(l => {
        const cls = l.cls ? ` class="${l.cls}"` : '';
        const safe = String(l.text).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        return `<span${cls}>${safe}</span>`;
      }).join('\n');
    };
    const section = (name) => {
      out('');
      out('████████████████████████████████████████████████████████', 'section-title');
      out('█  ' + name, 'section-title');
      out('████████████████████████████████████████████████████████', 'section-title');
    };
    const kv = (label, value, cls = '') => {
      out('  ' + String(label).padEnd(32) + value, cls);
    };
    const setStatus = (msg, active) => {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (active ? ' active' : '');
    };
    const showToast = (msg, isErr) => {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' err' : '');
      setTimeout(() => t.className = 'toast', 2200);
    };


    // ============================================================
    // DEPLOY VERIFICATION
    // Ordered, dependency-aware readiness check. Every step states
    // PASS / FAIL / WARN and the report ends with the single next
    // action to take.
    // ============================================================

    const V = { pass: 0, fail: 0, warn: 0, blockers: [], next: null };

    function vres(label, state, detail) {
      const mark = state === 'PASS' ? '✓' : state === 'FAIL' ? '✗' : '!';
      const cls  = state === 'PASS' ? 'ok'  : state === 'FAIL' ? 'err' : 'warn';
      out('  ' + mark + ' ' + String(label).padEnd(34) + (detail || ''), cls);
      if (state === 'PASS') V.pass++;
      else if (state === 'FAIL') { V.fail++; V.blockers.push(label); }
      else V.warn++;
    }

    async function runVerify() {
      lines.length = 0;
      V.pass = 0; V.fail = 0; V.warn = 0; V.blockers = []; V.next = null;
      document.getElementById('verifyBtn').disabled = true;
      setStatus('Verifying…', true);

      out('EDGE DEPLOY VERIFICATION');
      out('Generated: ' + new Date().toISOString());

      await vStep1_Cache();
      await vStep2_Modules();
      await vStep3_Served();
      await vStep4_Credentials();
      await vStep5_Tables();
      await vStep6_Freshness();
      vStep7_Verdict();

      setStatus('Done · ' + new Date().toLocaleTimeString(), false);
      document.getElementById('verifyBtn').disabled = false;
      render();
    }

    // ── 1. Stale cache is the most common reason a deploy looks inert ──
    async function vStep1_Cache() {
      section('1. SERVICE WORKER / CACHE');
      if (!('serviceWorker' in navigator)) {
        vres('Service worker', 'WARN', 'unsupported — no cache to go stale');
        return;
      }
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        vres('Registrations', regs.length ? 'PASS' : 'WARN',
             regs.length + ' active');

        const keys = await caches.keys();
        out('  cache buckets: ' + (keys.join(', ') || 'none'));

        const stale = keys.filter(k => /edge-v1|edge-v2/.test(k));
        if (stale.length) {
          vres('Shell cache version', 'FAIL',
               'stale (' + stale.join(', ') + ') — old modules will be served');
          V.next = V.next || 'Tap PURGE CACHE below, then reload this page.';
        } else {
          vres('Shell cache version', 'PASS', keys.length ? 'current' : 'not yet cached');
        }
      } catch (e) {
        vres('Cache inspection', 'WARN', e.message);
      }
    }

    // ── 2. Every module the pipeline needs ──
    async function vStep2_Modules() {
      section('2. MODULES');
      const required = [
        ['EDGE_POWER',         'power-engine.js',         true],
        ['EDGE_ALGOS',         'algorithms.js',           true],
        ['EDGE_GOVERNOR',      'governor.js',             true],
        ['EDGE_PHYSICS',       'physics.js',              true],
        ['EDGE_ORCHESTRATOR',  'orchestrator.js',         true],
        ['EDGE_CONTEXT',       'context-builder.js',      true],
        ['EDGE_CLAUDE',        'claude.js',               false],
        ['EDGE_LEARNING',      'learning.js',             false],
        ['EDGE_PARLAY',        'parlay.js',               false],
        ['EDGE_ROSTER',        'roster-engine.js',        false],
        ['EDGE_ROSTER_ENRICH', 'roster-enrichment.js',    false],
        ['EDGE_INJURY',        'injury-fragmentation.js', false],
        ['EDGE_ATS',           'ats-tracker.js',          false],
      ];
      required.forEach(([name, file, critical]) => {
        const mod = window[name];
        if (typeof mod === 'undefined') {
          vres(name, critical ? 'FAIL' : 'WARN', file + ' did not load');
        } else {
          vres(name, 'PASS', Object.keys(mod).length + ' exports');
        }
      });

      // The specific failure that killed the whole pipeline last build.
      if (window.EDGE_POWER && typeof window.EDGE_POWER.computeGamePrior !== 'function') {
        vres('EDGE_POWER.computeGamePrior', 'FAIL', 'wrong file deployed as power-engine.js');
      }
    }

    // ── 3. Confirm the served files are the new ones ──
    async function vStep3_Served() {
      section('3. SERVED FILE VERSIONS');
      const checks = [
        ['power-engine.js',      'computeAllTeamRatings', 'v4 power engine'],
        ['power-engine.js',      'seasonStart',           'season-clamped lookback'],
        ['ats-tracker.js',       'resolveGameOdds',       'core-API odds source'],
        ['roster-engine.js',     'EDGE_ROSTER_ENGINE',    'roster builder present'],
        ['roster-enrichment.js', 'buildNormalisers',      'z-scored enrichment'],
        ['parlay.js',            'matchupTrends',         'H2H trend engine'],
        ['matchups.html',        'activeBook',            'book-filtered odds'],
      ];
      const cache = {};
      for (const [file, token, label] of checks) {
        try {
          if (!(file in cache)) {
            const res = await fetch(file + '?v=' + Date.now(), { cache: 'no-store' });
            cache[file] = res.ok ? await res.text() : null;
          }
          const body = cache[file];
          if (body === null) vres(label, 'FAIL', file + ' not found (404)');
          else vres(label, body.includes(token) ? 'PASS' : 'FAIL',
                    body.includes(token) ? file : file + ' is the old version');
        } catch (e) {
          vres(label, 'FAIL', e.message);
        }
      }
    }

    // ── 4. Credentials ──
    async function vStep4_Credentials() {
      section('4. CREDENTIALS');
      const url  = localStorage.getItem('edge_supabase_url');
      const key  = localStorage.getItem('edge_supabase_key');
      const odds = localStorage.getItem('edge_odds_api_key');
      const book = localStorage.getItem('edge_book_key');

      vres('Supabase URL', url ? 'PASS' : 'FAIL', url || 'not set — Settings › Connections');
      vres('Supabase key', key ? 'PASS' : 'FAIL', key ? 'set' : 'not set');

      if (url && key) {
        try {
          const res = await fetch(url + '/rest/v1/power_ratings?select=id&limit=1',
            { headers: { apikey: key, Authorization: 'Bearer ' + key } });
          vres('Supabase reachable', res.ok ? 'PASS' : 'FAIL', 'HTTP ' + res.status);
        } catch (e) { vres('Supabase reachable', 'FAIL', e.message); }
      }

      if (odds) {
        try {
          const res = await fetch('https://api.the-odds-api.com/v4/sports/?apiKey=' + odds);
          const left = res.headers.get('x-requests-remaining');
          vres('Odds API', res.ok ? 'PASS' : 'FAIL',
               res.ok ? (left ? left + ' requests left' : 'connected') : 'HTTP ' + res.status);
        } catch (e) { vres('Odds API', 'FAIL', e.message); }
      } else {
        vres('Odds API', 'FAIL', 'not set — Settings › Connections');
      }

      vres('Sportsbook', book ? 'PASS' : 'WARN',
           book ? 'pricing against ' + book : 'using consensus — Admin › Sportsbook to pick yours');

      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
        vres('ESPN', res.ok ? 'PASS' : 'FAIL', 'HTTP ' + res.status);
      } catch (e) { vres('ESPN', 'FAIL', e.message); }
    }

    // ── 5. Tables, in the order the pipeline fills them ──
    async function vStep5_Tables() {
      section('5. DATA TABLES');
      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { out('  skipped — Supabase not connected'); return; }

      const tables = [
        ['power_ratings',  'Build Power Ratings', true],
        ['players',        'Build Rosters',       false],
        ['team_ats',       'Build ATS',           false],
        ['matchup_ats',    'Build ATS',           false],
        ['historical_odds','Build ATS',           false],
        ['shadow_picks',   'Run pipeline',        false],
      ];

      for (const [table, action, critical] of tables) {
        try {
          const res = await fetch(url + '/rest/v1/' + table + '?select=*&limit=1',
            { headers: { apikey: key, Authorization: 'Bearer ' + key, Prefer: 'count=exact' } });
          if (!res.ok) {
            vres(table, 'FAIL', 'HTTP ' + res.status + ' — table missing?');
            continue;
          }
          const range = res.headers.get('content-range') || '';
          const count = parseInt(range.split('/')[1] || '0', 10);
          if (count > 0) vres(table, 'PASS', count.toLocaleString() + ' rows');
          else {
            vres(table, critical ? 'FAIL' : 'WARN', 'empty — run Admin › ' + action);
            V.next = V.next || 'Admin › ' + action;
          }
        } catch (e) { vres(table, 'FAIL', e.message); }
      }
    }

    // ── 6. Is the data current and clean ──
    async function vStep6_Freshness() {
      section('6. DATA QUALITY');
      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { out('  skipped — Supabase not connected'); return; }

      try {
        const res = await fetch(
          url + '/rest/v1/power_ratings?select=sport,team_name,games_played,record,updated_at&order=updated_at.desc&limit=400',
          { headers: { apikey: key, Authorization: 'Bearer ' + key } });
        if (!res.ok) { vres('Power ratings read', 'FAIL', 'HTTP ' + res.status); return; }
        const rows = await res.json();
        if (!rows.length) { vres('Power ratings', 'FAIL', 'no rows'); return; }

        const ageHrs = (Date.now() - new Date(rows[0].updated_at)) / 3600000;
        vres('Last rebuild', ageHrs < 36 ? 'PASS' : 'WARN', ageHrs.toFixed(1) + ' hours ago');

        const sports = {};
        rows.forEach(r => { (sports[r.sport] = sports[r.sport] || []).push(r); });
        Object.entries(sports).forEach(([sp, list]) => {
          const avg = list.reduce((a, r) => a + (r.games_played || 0), 0) / list.length;
          out('    ' + sp.padEnd(7) + list.length + ' teams · ' + avg.toFixed(1) + ' games avg');
        });

        // Preseason contamination signature: NFL teams carrying more
        // games than weeks elapsed since the season opened.
        const nfl = sports.NFL || [];
        if (nfl.length) {
          const opener = new Date(new Date().getFullYear(), 8, 4);
          const weeks = Math.max(0, Math.floor((Date.now() - opener) / (7 * 86400000)));
          const maxGames = Math.max(...nfl.map(r => r.games_played || 0));
          if (maxGames > weeks + 1) {
            vres('NFL preseason filter', 'FAIL',
                 maxGames + ' games vs ~' + weeks + ' weeks played — preseason is leaking in');
          } else {
            vres('NFL preseason filter', 'PASS', maxGames + ' games max, ~' + weeks + ' weeks in');
          }
        }

        const mlb = sports.MLB || [];
        if (mlb.length) {
          const avg = mlb.reduce((a, r) => a + (r.games_played || 0), 0) / mlb.length;
          const month = new Date().getMonth() + 1;
          const expected = month >= 9 ? 140 : month >= 7 ? 90 : 40;
          vres('MLB season coverage', avg >= expected * 0.8 ? 'PASS' : 'FAIL',
               avg.toFixed(0) + ' games avg, expected ~' + expected);
        }
      } catch (e) { vres('Data quality', 'FAIL', e.message); }
    }

    // ── 7. Verdict and the single next action ──
    function vStep7_Verdict() {
      section('7. VERDICT');
      out('  ' + V.pass + ' passed · ' + V.warn + ' warnings · ' + V.fail + ' failed',
          V.fail ? 'err' : 'ok');

      if (V.blockers.length) {
        out('');
        out('  Blocking:', 'err');
        V.blockers.forEach(b => out('    · ' + b, 'err'));
      }

      out('');
      if (V.fail === 0 && V.warn === 0) {
        out('  READY — run the pipeline from Today\u2019s Picks.', 'ok');
      } else if (V.next) {
        out('  NEXT: ' + V.next, 'warn');
      } else if (V.fail) {
        out('  NEXT: clear the blocking items above, then verify again.', 'warn');
      } else {
        out('  Usable. Warnings above are optional features.', 'warn');
      }

      out('');
      out('  Recommended order on a fresh deploy:');
      out('    1. Purge cache, reload');
      out('    2. Settings › Connections — Supabase, Odds API');
      out('    3. Admin › Sportsbook — pick your book');
      out('    4. Admin › Build Power Ratings');
      out('    5. Admin › Build Rosters, then Enrich Rosters');
      out('    6. Admin › Build ATS  (long, resumable — run twice)');
      out('    7. Matchups — refresh the board');
      out('    8. Today\u2019s Picks — run the pipeline');
      out('    9. Trend Bets — build');
    }

    // ── Cache purge ──
    async function purgeCache() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        showToast('Cache purged — reloading');
        setTimeout(() => location.reload(true), 900);
      } catch (e) {
        showToast('Purge failed: ' + e.message, true);
      }
    }

    // ============================================================
    // MAIN
    // ============================================================

    async function runAll() {
      lines.length = 0;
      document.getElementById('runBtn').disabled = true;
      setStatus('Running…', true);

      out('EDGE FULL DIAGNOSTIC');
      out('Generated: ' + new Date().toISOString());

      await checkEnvironment();
      await checkModulesLoaded();
      await checkRemoteFiles();
      await checkLocalStorage();
      await checkSupabaseSettings();
      await checkAllTables();
      await checkPowerRatingsBySport();
      await checkESPN();
      await checkOddsAPI();
      await checkGames();
      await checkTeamMatch();
      await checkContextBuilder();
      await simulatePipeline();

      out('');
      out('████████████████████████████████████████████████████████');
      out('█  END OF REPORT');
      out('████████████████████████████████████████████████████████');

      setStatus('Done · ' + new Date().toLocaleTimeString(), false);
      document.getElementById('runBtn').disabled = false;
      render();
    }

    // 1. ENVIRONMENT
    async function checkEnvironment() {
      section('1. ENVIRONMENT');
      kv('Page URL', location.href, 'info');
      kv('User agent', navigator.userAgent.slice(0, 90), 'info');
      kv('Online', navigator.onLine ? 'yes' : 'NO', navigator.onLine ? 'ok' : 'err');

      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          kv('SW registrations', regs.length, regs.length ? 'warn' : 'ok');
          regs.forEach((r, i) => {
            kv(`  SW[${i}] scope`, r.scope, 'info');
            kv(`  SW[${i}] active`, r.active?.scriptURL || 'none', 'info');
          });
        } else {
          kv('Service worker', 'not supported', 'warn');
        }
      } catch (e) { kv('SW check', 'error: ' + e.message, 'err'); }

      try {
        const keys = await caches.keys();
        kv('Cache names', keys.length ? keys.join(', ') : '(none)', 'info');
        for (const k of keys) {
          const c = await caches.open(k);
          const reqs = await c.keys();
          kv(`  ${k}`, reqs.length + ' files cached', 'info');
        }
      } catch (e) { kv('Cache check', 'error: ' + e.message, 'err'); }
    }

    // 2. MODULES
    async function checkModulesLoaded() {
      section('2. MODULES LOADED (window globals)');
      const mods = [
        'EDGE_POWER', 'EDGE_ALGOS', 'EDGE_GOVERNOR', 'EDGE_PHYSICS',
        'EDGE_CLAUDE', 'EDGE_CONTEXT', 'EDGE_ORCHESTRATOR',
        'EDGE_LEARNING', 'EDGE_PARLAY'
      ];
      mods.forEach(m => {
        const v = window[m];
        if (typeof v === 'undefined') {
          kv(m, 'NOT LOADED', 'err');
        } else {
          const keys = Object.keys(v).slice(0, 12).join(', ');
          kv(m, 'loaded (' + Object.keys(v).length + ' exports)', 'ok');
          out('      exports: ' + keys);
        }
      });

      if (window.EDGE_POWER) {
        kv('EDGE_POWER.isSportInSeason', typeof window.EDGE_POWER.isSportInSeason, window.EDGE_POWER.isSportInSeason ? 'ok' : 'err');
        kv('EDGE_POWER.SEASON_WINDOWS', window.EDGE_POWER.SEASON_WINDOWS ? 'present' : 'missing', window.EDGE_POWER.SEASON_WINDOWS ? 'ok' : 'err');
      }
      if (window.EDGE_CONTEXT) {
        kv('EDGE_CONTEXT.buildContext', typeof window.EDGE_CONTEXT.buildContext, 'ok');
      }
      if (window.EDGE_ORCHESTRATOR) {
        kv('EDGE_ORCHESTRATOR.run', typeof window.EDGE_ORCHESTRATOR.run, 'ok');
      }
    }

    // 3. REMOTE FILES
    async function checkRemoteFiles() {
      section('3. REMOTE FILE CONTENT (what is served)');
      const files = ['power-engine.js', 'algorithms.js', 'governor.js', 'physics.js', 'claude.js', 'context-builder.js', 'orchestrator.js', 'learning.js', 'parlay.js', 'sw.js'];
      for (const f of files) {
        try {
          const res = await fetch(f + '?cb=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) { kv(f, 'HTTP ' + res.status, 'err'); continue; }
          const text = await res.text();
          kv(f, text.length + ' bytes', 'ok');
          if (f === 'power-engine.js') {
            kv('  has SEASON_WINDOWS', text.includes('SEASON_WINDOWS') ? 'yes' : 'NO', text.includes('SEASON_WINDOWS') ? 'ok' : 'err');
            kv('  has isSportInSeason', text.includes('isSportInSeason') ? 'yes' : 'NO', text.includes('isSportInSeason') ? 'ok' : 'err');
          }
          if (f === 'governor.js') {
            kv('  has 2.5x amplifier', text.includes('* 2.5') ? 'YES (bad)' : 'no', text.includes('* 2.5') ? 'err' : 'ok');
          }
        } catch (e) { kv(f, 'ERROR: ' + e.message, 'err'); }
      }
    }

    // 4. LOCALSTORAGE
    async function checkLocalStorage() {
      section('4. LOCAL STORAGE');
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
      keys.sort();
      kv('Total keys', keys.length, 'info');
      keys.forEach(k => {
        const v = localStorage.getItem(k);
        const display = v.length > 100 ? v.slice(0, 100) + `… (${v.length} chars)` : v;
        out('  ' + k.padEnd(32) + '= ' + display);
      });
    }

    // 5. SUPABASE SETTINGS
    async function checkSupabaseSettings() {
      section('5. SUPABASE SETTINGS TABLE');
      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { kv('Config', 'missing', 'err'); return; }
      try {
        const res = await fetch(`${url}/rest/v1/settings?select=*`, {
          headers: { apikey: key, Authorization: `Bearer ${key}` }
        });
        if (!res.ok) { kv('Query', 'HTTP ' + res.status, 'err'); return; }
        const rows = await res.json();
        kv('Rows', rows.length, rows.length ? 'ok' : 'warn');
        if (rows[0]) {
          Object.entries(rows[0]).forEach(([k, v]) => kv('  ' + k, String(v), 'info'));
        }
      } catch (e) { kv('Error', e.message, 'err'); }
    }

    // 6. TABLES
    async function checkAllTables() {
      section('6. SUPABASE TABLE SNAPSHOTS');
      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { kv('Config', 'missing', 'err'); return; }

      const tables = [
        'power_ratings', 'coaching_ratings', 'shadow_picks',
        'algorithm_weights', 'line_history', 'bet_log', 'game_priors',
        'backtest_runs', 'picks', 'settings'
      ];

      for (const t of tables) {
        try {
          const res = await fetch(`${url}/rest/v1/${t}?select=*&limit=3`, {
            headers: { apikey: key, Authorization: `Bearer ${key}` }
          });
          if (!res.ok) {
            kv(t, 'HTTP ' + res.status, res.status === 404 ? 'err' : 'warn');
            continue;
          }
          const rows = await res.json();
          kv(t, rows.length + ' sample rows', rows.length ? 'ok' : 'warn');
          if (rows[0]) {
            const cols = Object.keys(rows[0]);
            out('      columns: ' + cols.slice(0, 15).join(', '));
          }
        } catch (e) { kv(t, 'ERROR: ' + e.message, 'err'); }
      }

    // 7. POWER RATINGS BY SPORT
    async function checkPowerRatingsBySport() {
      section('7. POWER RATINGS BY SPORT');
      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { kv('Config', 'missing', 'err'); return; }

      try {
        const res = await fetch(
          `${url}/rest/v1/power_ratings?select=sport,team_name,overall,games_played,updated_at&order=overall.desc&limit=2000`,
          { headers: { apikey: key, Authorization: `Bearer ${key}` } }
        );
        if (!res.ok) { kv('Query', 'HTTP ' + res.status, 'err'); return; }
        const rows = await res.json();

        kv('Total rows', rows.length, 'ok');
        const bySport = {};
        rows.forEach(r => { bySport[r.sport] = (bySport[r.sport] || 0) + 1; });
        Object.entries(bySport).sort().forEach(([s, c]) => kv('  · ' + s, c + ' teams', 'info'));

        const latest = rows[0]?.updated_at;
        kv('Most recent update', latest || '—', 'info');

        const high = rows.filter(r => r.overall >= 90).length;
        const mid = rows.filter(r => r.overall >= 60 && r.overall < 90).length;
        const low = rows.filter(r => r.overall < 60).length;
        kv('  ≥90 (too high)', high, high > rows.length * 0.2 ? 'err' : 'ok');
        kv('  60-89', mid, 'ok');
        kv('  <60', low, 'ok');

        out('');
        out('  Top 5:');
        rows.slice(0, 5).forEach((r, i) => {
          out(`    [${i+1}] ${r.sport} | ${r.team_name} | ${r.overall} | ${r.games_played}g`);
        });
      } catch (e) { kv('Error', e.message, 'err'); }
    }

    // 8. ESPN
    async function checkESPN() {
      section('8. ESPN API');
      const sports = [
        ['NFL', 'football/nfl'], ['NBA', 'basketball/nba'], ['MLB', 'baseball/mlb'],
        ['NHL', 'hockey/nhl'], ['NCAAF', 'football/college-football'],
        ['NCAAB', 'basketball/mens-college-basketball'], ['MLS', 'soccer/usa.1'],
      ];
      for (const [label, path] of sports) {

          if (res.ok) {
            const data = await res.json();
            const events = (data.events || []).length;
            kv(label, events + ' events today', events > 0 ? 'ok' : 'info');
          } else {
            kv(label, 'HTTP ' + res.status, 'err');
          }
        } catch (e) { kv(label, 'ERROR: ' + e.message, 'err'); }
      }
    }

    // 9. ODDS API
    async function checkOddsAPI() {
      section('9. THE ODDS API');
      const key = localStorage.getItem('edge_odds_api_key');
      const proxy = (localStorage.getItem('edge_proxy_url') || '').trim();
      if (!key && !proxy) { kv('Key', 'not set and no proxy', 'err'); return; }
      if (proxy) kv('Proxy', proxy, 'info');
      try {
        const url = proxy
          ? `${proxy.replace(/\/+$/, '')}/sports`
          : `https://api.the-odds-api.com/v4/sports/?apiKey=${key}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          kv('Sports available', Array.isArray(data) ? data.length : '?', 'ok');
          kv('Quota remaining', res.headers.get('x-requests-remaining') || '?', 'info');
          kv('Quota used', res.headers.get('x-requests-used') || '?', 'info');
        } else {
          kv('HTTP', res.status, 'err');
        }
      } catch (e) { kv('Error', e.message, 'err'); }
    }

    // 10. GAMES
    async function checkGames() {
      section('10. TODAY\'S GAMES (localStorage)');
      const raw = localStorage.getItem('edge_todays_games');
      if (!raw) { kv('edge_todays_games', 'NOT SET', 'err'); return; }

      let games = [];
      try { games = JSON.parse(raw); }
      catch (e) { kv('Parse', 'ERROR: ' + e.message, 'err'); return; }

      kv('Total games', games.length, games.length ? 'ok' : 'err');
      const ts = localStorage.getItem('edge_todays_games_ts');
      if (ts) {
        const ageMin = Math.round((Date.now() - parseInt(ts)) / 60000);
        kv('Cache age', ageMin + ' minutes', ageMin > 10 ? 'warn' : 'ok');
      }

      const bySport = {};
      games.forEach(g => {
        const s = g._sport || g.sport || 'UNKNOWN';
        bySport[s] = (bySport[s] || 0) + 1;
      });
      Object.entries(bySport).sort().forEach(([s, c]) => kv('  · ' + s, c + ' games', 'info'));

      out('');
      out('  First 5 games:');
      games.slice(0, 5).forEach((g, i) => {
        out(`    [${i+1}] ${g._sport || g.sport} | ${g.away_team || g.away} @ ${g.home_team || g.home} | spread=${g.spread ?? 'null'}`);
      });
    }

    // 11. TEAM MATCH
    async function checkTeamMatch() {
      section('11. TEAM NAME CROSS-CHECK');
      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { kv('Config', 'missing', 'err'); return; }

      let games = [];
      try { games = JSON.parse(localStorage.getItem('edge_todays_games') || '[]'); } catch {}
      if (!games.length) { kv('Status', 'No games', 'err'); return; }

      let ratings = [];
      try {
        const res = await fetch(`${url}/rest/v1/power_ratings?select=sport,team_name&limit=5000`,
          { headers: { apikey: key, Authorization: `Bearer ${key}` } });
        if (res.ok) ratings = await res.json();
      } catch {}
      if (!ratings.length) { kv('Status', 'No ratings', 'err'); return; }

      const ratingSet = new Set(ratings.map(r => `${r.sport}:${r.team_name}`));

      let homeOK = 0, awayOK = 0, bothOK = 0;
      const mismatches = [];

      games.forEach(g => {
        const sport = g._sport || g.sport;
        const home = g.home_team || g.home;
        const away = g.away_team || g.away;
        const hOK = ratingSet.has(`${sport}:${home}`);
        const aOK = ratingSet.has(`${sport}:${away}`);
        if (hOK) homeOK++;
        if (aOK) awayOK++;
        if (hOK && aOK) bothOK++;
        else if (mismatches.length < 10) mismatches.push({ sport, home, away, hOK, aOK });
      });

      kv('Total games', games.length, 'info');
      kv('Home matched', homeOK + '/' + games.length, homeOK === games.length ? 'ok' : 'warn');
      kv('Away matched', awayOK + '/' + games.length, awayOK === games.length ? 'ok' : 'warn');
      kv('BOTH matched (usable)', bothOK + '/' + games.length, bothOK > 0 ? 'ok' : 'err');

      if (mismatches.length) {
        out('');
        out('  Mismatches (first 10):');
        mismatches.forEach((m, i) => {
          out(`    [${i+1}] ${m.sport} | home="${m.home}" ${m.hOK?'✓':'✗'} | away="${m.away}" ${m.aOK?'✓':'✗'}`);
        });
      }
    }

    // 11b. CONTEXT BUILDER
    async function checkContextBuilder() {
      section('11b. CONTEXT BUILDER');
      if (!window.EDGE_CONTEXT) {
        kv('EDGE_CONTEXT', 'NOT LOADED', 'err');
        return;
      }
      kv('EDGE_CONTEXT', 'loaded', 'ok');

      let games = [];
      try { games = JSON.parse(localStorage.getItem('edge_todays_games') || '[]'); } catch {}
      if (!games.length) { kv('Games', 'none', 'err'); return; }

      const ctx = await EDGE_CONTEXT.buildContext(games);
      kv('Line history games', Object.keys(ctx.lineHistoryByGame).length, Object.keys(ctx.lineHistoryByGame).length > 0 ? 'ok' : 'warn');
      kv('Rest teams', Object.keys(ctx.restByTeam).length, Object.keys(ctx.restByTeam).length > 0 ? 'ok' : 'warn');
      kv('Travel games', Object.keys(ctx.travelByGame).length, Object.keys(ctx.travelByGame).length > 0 ? 'ok' : 'warn');
      kv('Weather games', Object.keys(ctx.weatherByGame || {}).length, 'info');
      kv('Injuries games', Object.keys(ctx.injuriesByGame || {}).length, 'info');

      if (Object.keys(ctx.travelByGame).length > 0) {
        const sample = Object.entries(ctx.travelByGame).slice(0, 3);
        out('');
        out('  Travel sample:');
        sample.forEach(([gid, t]) => out(`    ${gid.slice(0, 8)}… miles=${t.miles} tz=${t.timezones}`));
      }
    }

    // 12. SIMULATE PIPELINE
    async function simulatePipeline() {
      section('12. PIPELINE SIMULATION (with context)');

      if (!window.EDGE_POWER || !window.EDGE_ALGOS || !window.EDGE_GOVERNOR || !window.EDGE_PHYSICS) {
        kv('Modules', 'missing', 'err');
        return;
      }

      let games = [];
      try { games = JSON.parse(localStorage.getItem('edge_todays_games') || '[]'); } catch {}
      if (!games.length) { kv('Games', 'none', 'err'); return; }

      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');

      let ctx = {};
      if (window.EDGE_CONTEXT) {
        ctx = await EDGE_CONTEXT.buildContext(games);
        kv('Context loaded',
          `line_history=${Object.keys(ctx.lineHistoryByGame).length} · rest=${Object.keys(ctx.restByTeam).length} · travel=${Object.keys(ctx.travelByGame).length}`,
          'ok');
      }

      let ratings = [];
      try {
        const res = await fetch(`${url}/rest/v1/power_ratings?select=*&limit=5000`,
          { headers: { apikey: key, Authorization: `Bearer ${key}` } });
        if (res.ok) ratings = await res.json();
      } catch {}

      const ratingIndex = {};
      ratings.forEach(r => { ratingIndex[`${r.sport}:${r.team_name}`] = r; });

      let firstPrior = null;
      let builtCount = 0;

      for (const g of games.slice(0, 200)) {
        const sport = g._sport || g.sport;
        const home = g.home_team || g.home;
        const away = g.away_team || g.away;
        const homeStats = ratingIndex[`${sport}:${home}`];
        const awayStats = ratingIndex[`${sport}:${away}`];
        if (!homeStats || !awayStats) continue;

        try {
          const prior = await EDGE_POWER.computeGamePrior(g, {
            homeStats, awayStats,
            market: {
              open_spread: g.open_spread ?? null,
              current_spread: g.spread ?? null,
              total: g.total ?? null,
              home_ml: g.ml ?? null,
              away_ml: g.away_ml ?? null,
            },
          });
          builtCount++;
          const hasCtx = !!(ctx.lineHistoryByGame?.[g.id] || ctx.travelByGame?.[g.id]);
          if (!firstPrior || (!firstPrior.hasCtx && hasCtx)) {
            firstPrior = { prior, game: g, hasCtx };
          }
        } catch (e) {}
      }

      kv('Priors built (of first 200)', builtCount, builtCount > 0 ? 'ok' : 'err');
      if (!firstPrior) { out('  Cannot simulate — no priors built.', 'err'); return; }

      const prior = firstPrior.prior;
      const g = firstPrior.game;

      out('');
      out('  ── Simulating: ' + prior.away_team + ' @ ' + prior.home_team, 'info');

      const gameCtx = {
        lineHistory: ctx.lineHistoryByGame?.[g.id] || null,
        weather: ctx.weatherByGame?.[g.id] || null,
        homeInjuries: ctx.injuriesByGame?.[g.id]?.home || [],
        awayInjuries: ctx.injuriesByGame?.[g.id]?.away || [],
        homeRestDays: ctx.restByTeam?.[`${prior.sport}:${prior.home_team}`] ?? null,
        awayRestDays: ctx.restByTeam?.[`${prior.sport}:${prior.away_team}`] ?? null,
        travelMiles: ctx.travelByGame?.[g.id]?.miles ?? null,
        timezoneShift: ctx.travelByGame?.[g.id]?.timezones ?? null,
        hoursToGame: prior.commence_time ? Math.max(0, (new Date(prior.commence_time) - Date.now()) / 3600000) : null,
      };

      out('  Context for this game:');
      out(`    lineHistory:    ${gameCtx.lineHistory ? 'present' : 'null'}`);
      out(`    rest home/away: ${gameCtx.homeRestDays} / ${gameCtx.awayRestDays}`);
      out(`    travel miles:   ${gameCtx.travelMiles}`);
      out(`    timezone shift: ${gameCtx.timezoneShift}`);

      let families = [];
      try {
        families = await EDGE_ALGOS.runAll(prior, gameCtx);
        kv('Algorithm families returned', families.length, families.length ? 'ok' : 'err');
        families.forEach(f => {
          const voteStr = f.vote === 'yes' ? 'YES' : f.vote === 'no' ? 'NO ' : 'NEU';
          const cls = f.vote === 'yes' ? 'ok' : f.vote === 'no' ? 'err' : 'info';
          out(`      ${f.family.padEnd(20)} ${voteStr}  conf=${(f.confidence * 100).toFixed(0)}%  edge=${(f.edge * 100).toFixed(2)}%  ${f.reason || ''}`, cls);
        });
      } catch (e) {
        kv('Algorithm error', e.message, 'err');
        return;
      }

      let gov = null;
      try {
        gov = EDGE_GOVERNOR.run(families, prior);
        out('');
        out('  ── Governor output:');
        kv('    consensus_score', gov.consensus_score, 'info');
        kv('    confidence', gov.confidence + '%', gov.confidence > 40 ? 'ok' : 'warn');
        kv('    edge', (gov.edge * 100).toFixed(2) + '%', 'info');
        kv('    agreement_index', gov.agreement_index, 'info');
        kv('    decision', gov.decision, gov.decision !== 'PASS' ? 'ok' : 'warn');
        kv('    units', gov.units, 'info');
        kv('    data_cap', gov.data_cap + (gov.data_caps?.length ? ' (' + gov.data_caps.join(', ') + ')' : ''), 'info');
      } catch (e) {
        kv('Governor error', e.message, 'err');
        return;
      }

      try {
        const phys = EDGE_PHYSICS.decide(gov, prior, gameCtx);
        out('');
        out('  ── Physics output:');
        kv('    decision', phys.decision, phys.decision !== 'PASS' && phys.decision !== 'CAPPED' ? 'ok' : 'warn');
        kv('    units', phys.units, 'info');
        kv('    confidence', phys.confidence + '%', 'info');
        kv('    edge', (phys.edge * 100).toFixed(2) + '%', 'info');
        if (phys.reasons?.length) {
          out('    reasons:');
          phys.reasons.forEach(r => out('      · ' + r));
        }
      } catch (e) {
        kv('Physics error', e.message, 'err');
      }
    }

    // COPY
    function copyAll() {
      const text = lines.map(l => l.text).join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast('Copied ' + lines.length + ' lines'))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('Copied'); }
      catch { showToast('Copy failed', true); }
      document.body.removeChild(ta);
    }

    render();
  </script>
