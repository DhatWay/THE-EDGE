<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDGE — Diagnostic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C; --gold-dim: #8A6E2F;
      --bg: #080808; --bg2: #0F0F0F; --bg4: #1C1C1C;
      --surface: #111111; --border: rgba(201,168,76,0.12);
      --text: #F0EAD8; --text-dim: #7A7060; --text-mid: #A89878;
      --green: #27AE60; --red: #E74C3C; --blue: #4A90D9;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 60px; background: rgba(8,8,8,0.97); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-mark { width: 34px; height: 34px; background: var(--gold); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 16px; display: flex; align-items: center; justify-content: center; clip-path: polygon(15% 0%,85% 0%,100% 15%,100% 85%,85% 100%,15% 100%,0% 85%,0% 15%); }
    .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 5px; color: var(--gold); line-height: 1; }
    .logo-sub  { font-size: 8px; letter-spacing: 2.5px; color: var(--text-dim); text-transform: uppercase; }
    main { padding-top: 60px; }
    .header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; }
    .title em { color: var(--gold); font-style: normal; }
    .btn-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { background: var(--gold); border: none; color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 2px; padding: 9px 18px; cursor: pointer; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.secondary { background: none; border: 1px solid var(--border); color: var(--text-mid); }
    .btn.secondary:hover { border-color: var(--gold); color: var(--gold); }
    .status { padding: 10px 20px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--bg2); }
    .status.active { color: var(--gold); }
    pre { padding: 16px 20px 40px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; line-height: 1.6; color: var(--text-mid); white-space: pre-wrap; word-break: break-word; }
    .section-title { color: var(--gold); font-weight: 700; margin-top: 14px; display: block; }
    .ok { color: var(--green); }
    .err { color: var(--red); }
    .warn { color: var(--gold); }
    .info { color: var(--blue); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--green); color: #000; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 10px 24px; z-index: 200; opacity: 0; transition: all 0.3s; white-space: nowrap; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--red); color: #fff; }
  </style>
</head>
<body>

  <nav>
    <div class="logo">
      <div class="logo-mark">ED</div>
      <div>
        <div class="logo-text">EDGE</div>
        <div class="logo-sub">Diagnostic</div>
      </div>
    </div>
  </nav>

  <main>
    <div class="header">
      <div class="title">DIAG<em>NOSTIC</em></div>
      <div class="btn-bar">
        <button class="btn" id="runBtn" onclick="runDiagnostics()">▶ RUN ALL</button>
        <button class="btn secondary" id="copyBtn" onclick="copyAll()">⧉ COPY ALL</button>
      </div>
    </div>

    <div class="status" id="status">Idle — tap RUN ALL</div>

    <pre id="output">Diagnostic will appear here.</pre>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const lines = [];

    function out(text, cls) {
      if (cls) lines.push({ text, cls });
      else lines.push({ text });
      render();
    }

    function render() {
      const el = document.getElementById('output');
      el.innerHTML = lines.map(l => {
        const cls = l.cls ? ` class="${l.cls}"` : '';
        return `<span${cls}>${escapeHtml(l.text)}</span>`;
      }).join('\n');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function section(name) {
      out('');
      out('══════════════════════════════════════════════════════', 'section-title');
      out('  ' + name, 'section-title');
      out('══════════════════════════════════════════════════════', 'section-title');
    }

    function line(label, value, cls) {
      const pad = label.padEnd(28);
      out('  ' + pad + '  ' + (value ?? '—'), cls);
    }

    function setStatus(msg, active) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (active ? ' active' : '');
    }

    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' err' : '');
      setTimeout(() => t.className = 'toast', 2200);
    }

    // ============================================================
    // RUN DIAGNOSTICS
    // ============================================================

    async function runDiagnostics() {
      lines.length = 0;
      document.getElementById('runBtn').disabled = true;
      setStatus('Running…', true);

      out('EDGE DIAGNOSTIC REPORT');
      out('Generated: ' + new Date().toISOString());

      await checkLocalStorage();
      await checkSupabaseConnection();
      await checkSupabaseTables();
      await checkSettings();
      await checkTodaysGames();
      await checkPowerRatings();
      await checkTeamNameMatching();
      await checkESPN();
      await checkOddsAPI();

      out('');
      out('══════════════════════════════════════════════════════');
      out('  END OF REPORT');
      out('══════════════════════════════════════════════════════');

      setStatus('Done · ' + new Date().toLocaleTimeString(), false);
      document.getElementById('runBtn').disabled = false;
    }

    // ============================================================
    // 1. LOCAL STORAGE
    // ============================================================

    async function checkLocalStorage() {
      section('1. LOCAL STORAGE KEYS');

      const keys = ['edge_supabase_url', 'edge_supabase_key', 'edge_odds_api_key',
                    'edge_claude_api_key', 'edge_decision_mode', 'edge_active_portfolio',
                    'edge_betting_mode', 'edge_bankroll', 'edge_unit_size',
                    'edge_sim_bankroll', 'edge_sim_unit_size',
                    'edge_governor_calibration', 'edge_dynamic_weights',
                    'edge_todays_games', 'edge_todays_games_ts'];

      keys.forEach(k => {
        const v = localStorage.getItem(k);
        if (v === null) {
          line(k, '(not set)', 'err');
        } else {
          let display = v.length > 60 ? v.slice(0, 60) + '…' : v;
          line(k, display, 'ok');
        }
      });
    }

    // ============================================================
    // 2. SUPABASE CONNECTION
    // ============================================================

    async function checkSupabaseConnection() {
      section('2. SUPABASE CONNECTION');

      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');

      if (!url || !key) {
        line('Connection', 'MISSING URL OR KEY', 'err');
        return;
      }

      line('URL', url, 'ok');
      line('Key prefix', key.slice(0, 20) + '…', 'ok');

      try {
        const res = await fetch(`${url}/rest/v1/settings?select=id&limit=1`, {
          headers: { apikey: key, Authorization: `Bearer ${key}` }
        });
        if (res.ok) {
          line('Reachability', 'OK (' + res.status + ')', 'ok');
        } else {
          line('Reachability', 'FAILED (' + res.status + ')', 'err');
          const txt = await res.text().catch(() => '');
          line('Response', txt.slice(0, 200), 'err');
        }
      } catch (e) {
        line('Reachability', 'ERROR: ' + e.message, 'err');
      }
    }

    // ============================================================
    // 3. SUPABASE TABLE COUNTS
    // ============================================================

    async function checkSupabaseTables() {
      section('3. SUPABASE TABLE COUNTS');

      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { line('Status', 'No Supabase', 'err'); return; }

      const tables = ['power_ratings', 'coaching_ratings', 'shadow_picks',
                      'algorithm_weights', 'line_history', 'bet_log',
                      'game_priors', 'backtest_runs'];

      for (const t of tables) {
        try {
          const res = await fetch(`${url}/rest/v1/${t}?select=id&limit=1000`, {
            headers: { apikey: key, Authorization: `Bearer ${key}`, Prefer: 'count=exact' }
          });
          if (!res.ok) {
            line(t, 'HTTP ' + res.status, 'err');
            continue;
          }
          const rows = await res.json();
          const count = rows.length;
          const cls = count > 0 ? 'ok' : 'warn';
          line(t, count + ' rows', cls);
        } catch (e) {
          line(t, 'ERROR: ' + e.message, 'err');
        }
      }
    }

    // ============================================================
    // 4. SETTINGS SNAPSHOT
    // ============================================================

    async function checkSettings() {
      section('4. SETTINGS');

      const settings = [
        ['Decision mode', localStorage.getItem('edge_decision_mode') || 'math_only'],
        ['Portfolio', localStorage.getItem('edge_active_portfolio') || 'real'],
        ['Betting mode', localStorage.getItem('edge_betting_mode') || 'manual'],
        ['Bankroll', localStorage.getItem('edge_bankroll') || '0'],
        ['Unit size', localStorage.getItem('edge_unit_size') || '0'],
        ['Sim bankroll', localStorage.getItem('edge_sim_bankroll') || '0'],
        ['Sim unit size', localStorage.getItem('edge_sim_unit_size') || '0'],
        ['Daily cap', localStorage.getItem('edge_daily_cap') || '0'],
        ['Max bets', localStorage.getItem('edge_max_bets') || '0'],
      ];

      settings.forEach(([k, v]) => line(k, v, v === '0' ? 'warn' : 'ok'));
    }

    // ============================================================
    // 5. TODAY'S GAMES
    // ============================================================

    async function checkTodaysGames() {
      section('5. TODAY\'S GAMES (localStorage)');

      let games = [];
      try {
        games = JSON.parse(localStorage.getItem('edge_todays_games') || '[]');
      } catch (e) {
        line('Parse', 'ERROR: ' + e.message, 'err');
        return;
      }

      const ts = localStorage.getItem('edge_todays_games_ts');
      line('Total games', games.length, games.length > 0 ? 'ok' : 'err');
      if (ts) {
        const ageMin = Math.round((Date.now() - parseInt(ts)) / 60000);
        line('Cache age', ageMin + ' minutes', ageMin > 10 ? 'warn' : 'ok');
      }

      // Count by sport
      const bySport = {};
      games.forEach(g => {
        const s = g._sport || g.sport || 'UNKNOWN';
        bySport[s] = (bySport[s] || 0) + 1;
      });
      Object.entries(bySport).forEach(([s, c]) => line('  · ' + s, c, 'info'));

      // Sample 5 games
      out('');
      out('  Sample (first 5):');
      games.slice(0, 5).forEach((g, i) => {
        const home = g.home_team || g.home || '?';
        const away = g.away_team || g.away || '?';
        const sport = g._sport || g.sport || '?';
        const spread = g.spread ?? g.home_spread ?? '—';
        out(`    [${i+1}] ${sport} | ${away} @ ${home} | spread ${spread}`);
      });

      // Check if any have market data
      const withSpread = games.filter(g => g.spread != null).length;
      const withML = games.filter(g => g.ml != null || g.home_ml != null).length;
      line('  Games with spread', withSpread, withSpread > 0 ? 'ok' : 'warn');
      line('  Games with ML', withML, withML > 0 ? 'ok' : 'warn');
    }

    // ============================================================
    // 6. POWER RATINGS
    // ============================================================

    async function checkPowerRatings() {
      section('6. POWER RATINGS (Supabase)');

      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');
      if (!url || !key) { line('Status', 'No Supabase', 'err'); return; }

      try {
        const res = await fetch(
          `${url}/rest/v1/power_ratings?select=sport,team_name,overall,games_played,updated_at&order=overall.desc&limit=1000`,
          { headers: { apikey: key, Authorization: `Bearer ${key}` } }
        );
        if (!res.ok) { line('Fetch', 'HTTP ' + res.status, 'err'); return; }
        const rows = await res.json();

        line('Total rated teams', rows.length, rows.length > 0 ? 'ok' : 'err');

        const bySport = {};
        rows.forEach(r => { bySport[r.sport] = (bySport[r.sport] || 0) + 1; });
        Object.entries(bySport).forEach(([s, c]) => line('  · ' + s, c, c > 0 ? 'ok' : 'warn'));

        if (rows.length > 0) {
          line('Most recent update', rows[0].updated_at || '—', 'info');

          // Rating distribution
          const highs = rows.filter(r => r.overall >= 90).length;
          const mids = rows.filter(r => r.overall >= 60 && r.overall < 90).length;
          const lows = rows.filter(r => r.overall < 60).length;
          line('  ≥90 rated', highs, highs > rows.length * 0.3 ? 'err' : 'ok');
          line('  60-89 rated', mids, 'ok');
          line('  <60 rated', lows, 'ok');

          out('');
          out('  Top 5:');
          rows.slice(0, 5).forEach((r, i) => {
            out(`    [${i+1}] ${r.sport} | ${r.team_name} | overall ${r.overall} | ${r.games_played} games`);
          });
        }
      } catch (e) {
        line('Error', e.message, 'err');
      }
    }

    // ============================================================
    // 7. TEAM NAME MATCHING (THE KEY DIAGNOSTIC)
    // ============================================================

    async function checkTeamNameMatching() {
      section('7. TEAM NAME MATCHING — WHY PRIORS FAIL');

      const url = localStorage.getItem('edge_supabase_url');
      const key = localStorage.getItem('edge_supabase_key');

      let games = [];
      try { games = JSON.parse(localStorage.getItem('edge_todays_games') || '[]'); } catch {}
      if (!games.length) { line('No games loaded', 'SKIP', 'err'); return; }

      let ratings = [];
      try {
        const res = await fetch(
          `${url}/rest/v1/power_ratings?select=sport,team_name&limit=5000`,
          { headers: { apikey: key, Authorization: `Bearer ${key}` } }
        );
        if (res.ok) ratings = await res.json();
      } catch {}
      if (!ratings.length) { line('No ratings loaded', 'SKIP', 'err'); return; }

      // Build lookup set
      const ratingSet = new Set(ratings.map(r => `${r.sport}:${r.team_name}`));

      let homeMatched = 0;
      let awayMatched = 0;
      let bothMatched = 0;
      const mismatches = [];

      games.forEach(g => {
        const sport = g._sport || g.sport;
        const home = g.home_team || g.home;
        const away = g.away_team || g.away;

        const hKey = `${sport}:${home}`;
        const aKey = `${sport}:${away}`;
        const hMatch = ratingSet.has(hKey);
        const aMatch = ratingSet.has(aKey);

        if (hMatch) homeMatched++;
        if (aMatch) awayMatched++;
        if (hMatch && aMatch) bothMatched++;
        else if (mismatches.length < 10) {
          mismatches.push({ sport, home, away, hMatch, aMatch });
        }
      });

      line('Total games', games.length);
      line('Home team matched', `${homeMatched}/${games.length}`, homeMatched === games.length ? 'ok' : 'err');
      line('Away team matched', `${awayMatched}/${games.length}`, awayMatched === games.length ? 'ok' : 'err');
      line('BOTH matched (usable)', `${bothMatched}/${games.length}`, bothMatched > 0 ? 'ok' : 'err');

      if (mismatches.length) {
        out('');
        out('  ⚠ MATCH FAILURES (first 10):');
        mismatches.forEach(m => {
          out(`    ${m.sport}`);
          out(`      home: "${m.home}" ${m.hMatch ? '✓' : '✗ NOT FOUND'}`);
          out(`      away: "${m.away}" ${m.aMatch ? '✓' : '✗ NOT FOUND'}`);
        });
      }
    }

    // ============================================================
    // 8. ESPN REACHABILITY
    // ============================================================

    async function checkESPN() {
      section('8. ESPN API');

      const sports = [
        ['NFL',   'football/nfl'],
        ['NBA',   'basketball/nba'],
        ['MLB',   'baseball/mlb'],
        ['NHL',   'hockey/nhl'],
        ['NCAAF', 'football/college-football'],
        ['NCAAB', 'basketball/mens-college-basketball'],
      ];

      for (const [label, path] of sports) {
        try {
          const res = await fetch(
            `https://site.api.espn.com/apis/site/v2/sports/${path}/scoreboard`,
            { cache: 'no-store' }
          );
          if (res.ok) {
            const data = await res.json();
            const count = (data.events || []).length;
            line(label, `OK · ${count} events today`, 'ok');
          } else {
            line(label, 'HTTP ' + res.status, 'err');
          }
        } catch (e) {
          line(label, 'ERROR: ' + e.message, 'err');
        }
      }
    }

    // ============================================================
    // 9. ODDS API REACHABILITY
    // ============================================================

    async function checkOddsAPI() {
      section('9. THE ODDS API');

      const key = localStorage.getItem('edge_odds_api_key');
      if (!key) { line('Key', 'NOT SET', 'err'); return; }

      try {
        const res = await fetch(`https://api.the-odds-api.com/v4/sports/?apiKey=${key}`);
        if (res.ok) {
          const data = await res.json();
          line('Reachability', 'OK (' + data.length + ' sports)', 'ok');

          const quotaRemaining = res.headers.get('x-requests-remaining');
          const quotaUsed = res.headers.get('x-requests-used');
          if (quotaRemaining) line('Quota remaining', quotaRemaining, parseInt(quotaRemaining) < 100 ? 'err' : 'ok');
          if (quotaUsed) line('Quota used', quotaUsed, 'info');
        } else {
          line('Reachability', 'HTTP ' + res.status, 'err');
          const txt = await res.text().catch(() => '');
          line('Response', txt.slice(0, 200), 'err');
        }
      } catch (e) {
        line('Error', e.message, 'err');
      }
    }

    // ============================================================
    // COPY ALL
    // ============================================================

    function copyAll() {
      const text = lines.map(l => l.text).join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast('Copied ' + lines.length + ' lines', false))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Copied to clipboard', false);
      } catch {
        showToast('Copy failed', true);
      }
      document.body.removeChild(ta);
    }
  </script>
</body>
</html>
