<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-dim: #8A6E2F;
    --bg: #080808; --bg2: #0F0F0F; --bg4: #1C1C1C; --surface: #111111;
    --border: rgba(201,168,76,0.12); --border-bright: rgba(201,168,76,0.32);
    --text: #F0EAD8; --text-dim: #7A7060; --text-mid: #A89878;
    --green: #27AE60; --red: #E74C3C; --blue: #4A90D9;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 20px 16px 80px; font-size: 13px; line-height: 1.5; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 54px; background: rgba(8,8,8,0.97); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo-mark { width: 30px; height: 30px; background: var(--gold); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; clip-path: polygon(15% 0%,85% 0%,100% 15%,100% 85%,85% 100%,15% 100%,0% 85%,0% 15%); }
  .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 4px; color: var(--gold); line-height: 1; }
  .logo-sub { font-size: 7px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
  main { padding-top: 70px; max-width: 900px; margin: 0 auto; }

  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 4px; color: var(--text); margin-bottom: 4px; }
  h1 em { color: var(--gold); font-style: normal; }
  .sub { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 20px; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--border); padding: 14px; margin-bottom: 16px; }
  .ctrl { display: flex; flex-direction: column; gap: 5px; }
  .ctrl label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-dim); }
  .ctrl select, .ctrl input { background: var(--bg4); border: 1px solid var(--border); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 13px; padding: 8px 10px; }
  .ctrl select:focus, .ctrl input:focus { outline: none; border-color: var(--gold); }

  .run-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .btn { flex: 1; background: var(--gold); border: none; color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px; padding: 12px; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover:not(:disabled) { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary { background: none; border: 1px solid var(--border-bright); color: var(--gold); }

  .log { background: var(--bg4); border: 1px solid var(--border); padding: 12px 14px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: var(--text-mid); line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; margin-bottom: 16px; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 20px; }
  .sum-cell { background: var(--surface); padding: 14px 8px; text-align: center; }
  .sum-v { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; line-height: 1; }
  .sum-v.gold { color: var(--gold); }
  .sum-v.green { color: var(--green); }
  .sum-v.red { color: var(--red); }
  .sum-v.muted { color: var(--text-dim); }
  .sum-l { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }

  .section { margin-bottom: 20px; }
  .sec-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--text); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .sec-title em { color: var(--gold); font-style: normal; }

  .row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 4px; align-items: center; font-size: 12px; }
  .row.head { background: var(--bg4); font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); padding: 6px 10px; margin-bottom: 6px; }
  .row .name { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: var(--text); }
  .row .num { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; text-align: right; }
  .row .num.pos { color: var(--green); }
  .row .num.neg { color: var(--red); }
  .row .num.neu { color: var(--text-dim); }

  .game-row { display: grid; grid-template-columns: 60px 1fr 60px 70px 50px 50px; gap: 6px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 3px; align-items: center; font-size: 11px; }
  .game-row.head { background: var(--bg4); font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); padding: 5px 8px; margin-bottom: 5px; }
  .game-row .date { color: var(--text-dim); font-family: ui-monospace, monospace; font-size: 10px; }
  .game-row .matchup { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-row .num { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 1px; }
  .game-row .res-w { color: var(--green); font-weight: 700; }
  .game-row .res-l { color: var(--red); font-weight: 700; }
  .game-row .res-p { color: var(--gold); font-weight: 700; }
  .game-row .side { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-mid); }

  .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 6px 12px; cursor: pointer; }
  .filter-btn.active { border-color: var(--gold); color: var(--gold); }

  .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

  .pill { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 6px; border: 1px solid; margin-right: 4px; }
  .pill.gold { border-color: var(--gold); color: var(--gold); }
  .pill.green { border-color: var(--green); color: var(--green); }
  .pill.red { border-color: var(--red); color: var(--red); }
</style>

<body>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-mark">ED</div>
    <div>
      <div class="logo-text">EDGE</div>
      <div class="logo-sub">Slate Test</div>
    </div>
  </a>
</nav>

<main>
  <h1>SLATE <em>TEST</em></h1>
  <div class="sub">Walk-forward pipeline replay · Grade every pick against closing spread</div>

  <div class="controls">
    <div class="ctrl">
      <label>Sport</label>
      <select id="sport">
        <option value="NFL" selected>NFL</option>
        <option value="NCAAF">NCAAF</option>
        <option value="NBA">NBA</option>
        <option value="NCAAB">NCAAB</option>
        <option value="MLB">MLB</option>
        <option value="NHL">NHL</option>
        <option value="WNBA">WNBA</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Games cap</label>
      <select id="cap">
        <option value="200">200</option>
        <option value="500" selected>500</option>
        <option value="1000">1000</option>
        <option value="2000">2000</option>
      </select>
    </div>
    <div class="ctrl">
      <label>From</label>
      <input type="date" id="from" />
    </div>
    <div class="ctrl">
      <label>To</label>
      <input type="date" id="to" />
    </div>
  </div>

  <div class="run-row">
    <button class="btn" id="runBtn" onclick="run()">▶ Run Test</button>
    <button class="btn secondary" onclick="clearResults()">Clear</button>
  </div>

  <div class="log" id="log">Ready.</div>

  <div id="output"></div>
</main>

<script>
// ── Config ──
const SB_URL = () => localStorage.getItem('edge_supabase_url');
const SB_KEY = () => localStorage.getItem('edge_supabase_key');
const log = m => { const el = document.getElementById('log'); el.textContent += m + '\n'; el.scrollTop = el.scrollHeight; };
const clearLog = () => { document.getElementById('log').textContent = ''; };
const out = h => { document.getElementById('output').innerHTML = h; };

// ── Default date range: last 60 days ──
(function() {
  const to = new Date();
  const from = new Date(to.getTime() - 60 * 86400000);
  document.getElementById('from').value = from.toISOString().slice(0, 10);
  document.getElementById('to').value = to.toISOString().slice(0, 10);
})();

// ── State ──
let gameResults = [];   // per-game graded
let familyStats = {};   // per-family: { wins, losses, pushes, games }
let situationStats = {};// per-situation: { wins, losses, pushes, games }
let confStats = {};     // per-bucket: { wins, losses, pushes }

function clearResults() {
  gameResults = [];
  familyStats = {};
  situationStats = {};
  confStats = {};
  document.getElementById('log').textContent = 'Ready.';
  document.getElementById('output').innerHTML = '';
}

async function run() {
  const btn = document.getElementById('runBtn');
  const sport = document.getElementById('sport').value;
  const cap = parseInt(document.getElementById('cap').value, 10);
  const fromDate = document.getElementById('from').value;
  const toDate = document.getElementById('to').value;

  if (!fromDate || !toDate) { alert('Set both dates'); return; }
  const url = SB_URL(), key = SB_KEY();
  if (!url || !key) { alert('Supabase not connected'); return; }
  if (!window.EDGE_POWER || !window.EDGE_ALGOS || !window.EDGE_GOVERNOR || !window.EDGE_PHYSICS) {
    alert('Pipeline modules not loaded');
    return;
  }

  btn.disabled = true;
  clearLog();
  out('');
  log(`Slate test · ${sport} · ${fromDate} → ${toDate} · cap ${cap}`);

  try {
    // ── 1. Load historical games with scores ──
    log('Loading games with scores…');
    const games = await loadScoredGames(sport, fromDate, toDate, cap, url, key);
    log(`  ${games.length} games with final scores`);
    if (!games.length) {
      out('<div class="empty">No scored games in this range. Run Backfill Scores first.</div>');
      btn.disabled = false;
      return;
    }

    // ── 2. Warm-up history ──
    // Ratings for a game must be built only from games that finished
    // before it. Loading the current power_ratings table would hand the
    // model the outcomes of the very games being graded.
    log('Loading warm-up history…');
    const warmFrom = new Date(new Date(fromDate).getTime() - WARMUP_DAYS * 86400000)
      .toISOString().slice(0, 10);
    const warmup = await loadScoredGames(sport, warmFrom, fromDate, 6000, url, key);
    log(`  ${warmup.length} games before the window, for rating only`);

    const coaching = await loadCoachingForSport(sport, url, key);

    // ── 3. Load ATS and H2H ──
    log('Loading ATS form and H2H…');
    const atsIndex = await loadAtsForSport(sport, url, key);
    const h2hIndex = await loadH2HForSport(sport, url, key);
    log(`  ${Object.keys(atsIndex).length} ATS rows · ${Object.keys(h2hIndex).length} H2H pairs`);

    // ── 4. Walk forward ──
    // The window is cut into steps. At each step the ratings are
    // rebuilt from every game that had finished by then, and only the
    // games inside that step are graded. Nothing is ever picked using
    // information that did not exist at kickoff.
    if (!window.EDGE_RATING) {
      out('<div class="empty">rating-core.js not loaded — the walk-forward needs it.</div>');
      btn.disabled = false;
      return;
    }

    log('Walking forward…');
    const steps = buildSteps(games, STEP_DAYS[sport] || 7);
    log(`  ${steps.length} steps of ${STEP_DAYS[sport] || 7} days`);

    let processed = 0, skippedThin = 0;
    const total = games.length;

    for (let si = 0; si < steps.length; si++) {
      const step = steps[si];
      const history = warmup
        .concat(games.filter(x => new Date(x.game_date) < step.start));

      if (history.length < MIN_HISTORY) {
        skippedThin += step.games.length;
        processed += step.games.length;
        continue;
      }

      const power = buildPowerFromHistory(sport, history, coaching);
      if (!power) { processed += step.games.length; continue; }

      log(`  step ${si + 1}/${steps.length} · ${step.label} · ` +
          `${history.length} prior games · ${step.games.length} to grade`);

      for (const g of step.games) {
        try {
          const graded = await gradeOneGame(g, power, atsIndex, h2hIndex);
          if (graded) { gameResults.push(graded); tallyGraded(graded); }
        } catch (e) { /* usually an unmatched team name */ }
        processed++;
      }
    }

    log(`  ${processed}/${total} processed`);
    if (skippedThin) log(`  ${skippedThin} skipped — fewer than ${MIN_HISTORY} prior games`);
    log(`  ${gameResults.length} graded picks`);

    // ── 5. Report ──
    renderReport();

  } catch (e) {
    log('ERROR: ' + e.message);
    out('<div class="empty">Test failed: ' + e.message + '</div>');
  }

  btn.disabled = false;
}

// ============================================================
// ── LOAD GAMES WITH SCORES ──
// ============================================================

async function loadScoredGames(sport, fromDate, toDate, cap, url, key) {
  const rows = [];
  const pageSize = 1000;
  for (let offset = 0; offset < cap; offset += pageSize) {
    const limit = Math.min(pageSize, cap - offset);
    try {
      const res = await fetch(
        `${url}/rest/v1/historical_odds?sport=eq.${sport}` +
        `&home_score=not.is.null&away_score=not.is.null` +
        `&game_date=gte.${fromDate}&game_date=lte.${toDate}T23:59:59` +
        `&select=game_id,home,away,spread,total,home_score,away_score,game_date` +
        `&order=game_date.asc&limit=${limit}&offset=${offset}`,
        { headers: { apikey: key, Authorization: `Bearer ${key}` } }
      );
      if (!res.ok) break;
      const batch = await res.json();
      rows.push(...batch);
      if (batch.length < limit) break;
    } catch (e) { break; }
  }
  return rows.filter(r => r.spread != null);
}

// ============================================================
// ── LOAD POWER INDEX ──
// ============================================================

// How far back to reach for rating fuel before the window opens.
const WARMUP_DAYS = 400;

// Prior games needed before a step can be graded at all.
const MIN_HISTORY = 60;

// Length of each walk-forward step, per sport.
const STEP_DAYS = { NFL: 7, NCAAF: 7, NBA: 7, NCAAB: 7, NHL: 7, MLB: 7, MLS: 14, WNBA: 7 };

// Coaching ratings move slowly and are not derived from the games
// under test, so reading the current table is not look-ahead.
async function loadCoachingForSport(sport, url, key) {
  const coaching = {};
  try {
    const res = await fetch(`${url}/rest/v1/coaching_ratings?sport=eq.${sport}&select=*`,
      { headers: { apikey: key, Authorization: `Bearer ${key}` } });
    if (res.ok) (await res.json()).forEach(c => { coaching[`${c.sport}:${c.team_name}`] = c; });
  } catch {}
  return coaching;
}

// Cut the window into steps, each holding the games that kicked off
// inside it.
function buildSteps(games, stepDays) {
  const sorted = [...games].sort((a, b) => new Date(a.game_date) - new Date(b.game_date));
  if (!sorted.length) return [];

  const steps = [];
  let start = new Date(sorted[0].game_date);
  start.setHours(0, 0, 0, 0);
  const last = new Date(sorted[sorted.length - 1].game_date);

  while (start <= last) {
    const end = new Date(start.getTime() + stepDays * 86400000);
    const inStep = sorted.filter(g => {
      const d = new Date(g.game_date);
      return d >= start && d < end;
    });
    if (inStep.length) {
      steps.push({ start: new Date(start), end, label: start.toISOString().slice(0, 10), games: inStep });
    }
    start = end;
  }
  return steps;
}

// Build the power index from finished games only, in the same shape
// the live pipeline reads from the power_ratings table.
function buildPowerFromHistory(sport, history, coaching) {
  const R = window.EDGE_RATING;
  if (!R || !history.length) return null;

  const games = history.map(g => ({
    home: g.home, away: g.away,
    homeScore: g.home_score, awayScore: g.away_score,
    date: g.game_date, neutral: false,
  })).filter(g => isFinite(g.homeScore) && isFinite(g.awayScore));

  if (games.length < MIN_HISTORY) return null;

  const glicko = R.rateGlicko(sport, games);
  const massey = R.massey(sport, games);
  const colley = R.colley(games);
  const blended = R.blend(sport, glicko, massey, colley);
  const ad = R.attackDefense(sport, games);
  const league = ad._league || null;

  const agg = {};
  games.forEach(g => {
    [[g.home, g.homeScore, g.awayScore, true], [g.away, g.awayScore, g.homeScore, false]]
      .forEach(([team, pf, pa, isHome]) => {
        if (!agg[team]) agg[team] = { gp: 0, pf: 0, pa: 0, w: 0, l: 0, hw: 0, hl: 0, aw: 0, al: 0, margins: [] };
        const a = agg[team];
        a.gp++; a.pf += pf; a.pa += pa; a.margins.push(pf - pa);
        if (pf > pa) { a.w++; isHome ? a.hw++ : a.aw++; }
        else if (pf < pa) { a.l++; isHome ? a.hl++ : a.al++; }
      });
  });

  const cfg = (window.EDGE_POWER && window.EDGE_POWER.SPORT_CONFIG && window.EDGE_POWER.SPORT_CONFIG[sport])
    || { pyExp: 2.37, scale: 22, k: 8, avgPF: 22, avgPA: 22 };
  const teams = {};

  Object.keys(agg).forEach(name => {
    const a = agg[name];
    const g = glicko[name];
    if (!g) return;

    const avgPF = a.pf / a.gp, avgPA = a.pa / a.gp;
    const avgMOV = (a.pf - a.pa) / a.gp;
    const pythRaw = avgPA > 0
      ? Math.pow(avgPF, cfg.pyExp) / (Math.pow(avgPF, cfg.pyExp) + Math.pow(avgPA, cfg.pyExp))
      : 0.5;
    const realWeight = a.gp / (a.gp + cfg.k);
    const cl = v => Math.max(0, Math.min(100, v));

    const offense = cl(50 + (((avgPF - cfg.avgPF) / cfg.scale) * 25) * realWeight);
    const defense = cl(50 - (((avgPA - cfg.avgPA) / cfg.scale) * 25) * realWeight);
    const mov     = cl(50 + ((avgMOV / cfg.scale) * 25) * realWeight);
    const pyth    = 0.5 + (pythRaw - 0.5) * realWeight;

    const recent = a.margins.slice(-5);
    const wts = [0.10, 0.15, 0.20, 0.25, 0.30];
    const off = 5 - recent.length;
    let form = 0;
    recent.forEach((m, i) => { form += wts[off + i] * (m / cfg.scale) * 3; });

    teams[`${sport}:${name}`] = {
      sport, team_name: name,
      overall: Math.round(((pyth * 100 * 0.45) + (offense * 0.20) + (defense * 0.20) + (mov * 0.15)) * 10) / 10,
      offense: Math.round(offense * 10) / 10,
      defense: Math.round(defense * 10) / 10,
      pythagorean: Math.round(pyth * 10000) / 10000,
      srs: massey[name] != null ? massey[name] : 0,
      elo: Math.round(g.rating),
      glicko_rating: g.rating,
      glicko_rd: g.rd,
      glicko_vol: g.vol,
      massey: massey[name] != null ? massey[name] : null,
      colley: colley[name] != null ? colley[name] : null,
      composite_points: blended[name] ? blended[name].composite_points : null,
      rating_certainty: blended[name] ? blended[name].certainty : null,
      attack: ad[name] ? ad[name].attack : null,
      def_rate: ad[name] ? ad[name].defense : null,
      possessions: ad[name] ? ad[name].possessions : null,
      pace: Math.round(avgPF * 10) / 10,
      games_played: a.gp,
      record: `${a.w}-${a.l}`,
      home_record: `${a.hw}-${a.hl}`,
      away_record: `${a.aw}-${a.al}`,
      last5_form: Math.round(form * realWeight * 100) / 100,
    };
  });

  return { teams, coaching, league };
}

async function loadAtsForSport(sport, url, key) {
  const out = {};
  try {
    const res = await fetch(
      `${url}/rest/v1/team_ats?sport=eq.${sport}&select=*&limit=5000`,
      { headers: { apikey: key, Authorization: `Bearer ${key}` } }
    );
    if (res.ok) (await res.json()).forEach(r => { out[r.team_name] = r; });
  } catch {}
  return out;
}

async function loadH2HForSport(sport, url, key) {
  const out = {};
  try {
    const res = await fetch(
      `${url}/rest/v1/matchup_ats?sport=eq.${sport}&select=*&limit=5000`,
      { headers: { apikey: key, Authorization: `Bearer ${key}` } }
    );
    if (res.ok) {
      (await res.json()).forEach(r => {
        const k = [r.team_a, r.team_b].sort().join('|');
        out[k] = r;
      });
    }
  } catch {}
  return out;
}

// ============================================================
// ── GRADE ONE GAME ──
// Build a prior the way the live pipeline does, run the nine
// families + situations + governor + physics, then grade the
// result against the actual final score.
// ============================================================

async function gradeOneGame(g, power, atsIndex, h2hIndex) {
  const sport = g.sport || 'NFL';
  const homeKey = `${sport}:${g.home}`;
  const awayKey = `${sport}:${g.away}`;

  const homeStats = power.teams[homeKey];
  const awayStats = power.teams[awayKey];
  if (!homeStats || !awayStats) return null;

  const homeCoach = power.coaching[homeKey] || null;
  const awayCoach = power.coaching[awayKey] || null;

  const game = {
    id: g.game_id,
    _sport: sport,
    sport,
    home_team: g.home,
    away_team: g.away,
    home: g.home,
    away: g.away,
    spread: g.spread,
    total: g.total,
    commence_time: g.game_date,
  };

  // Minimal market — only what we stored.
  const market = {
    open_spread: null,      // historical_odds does not keep open
    current_spread: g.spread,
    total: g.total,
    home_ml: null,
    away_ml: null,
  };

  // Context — ATS + H2H from DB. No weather/rest (would require
  // re-fetching ESPN per game; separate project).
  const h2hKey = [g.home, g.away].sort().join('|');
  const gameContext = {
    homeAts: atsIndex[g.home] || null,
    awayAts: atsIndex[g.away] || null,
    h2h: h2hIndex[h2hKey] || null,
    hoursToGame: 24,
  };

  // 1. Prior
  let prior;
  try {
    prior = await EDGE_POWER.computeGamePrior(game, {
      homeStats: { ...homeStats, _coach: homeCoach },
      awayStats: { ...awayStats, _coach: awayCoach },
      market,
      // Without this the attack/defence projection is skipped entirely
      // and the prior silently falls back to a rating-gap estimate.
      league: power.league || null,
    });
  } catch { return null; }

  // 2. Algorithms
  let families;
  try {
    families = await EDGE_ALGOS.runAll(prior, gameContext);
  } catch { families = []; }

  // 3. Situations
  let sitFamily = null;
  if (window.EDGE_SITUATIONS) {
    try {
      const slateGame = {
        id: g.game_id, _sport: sport, sport,
        home_team: g.home, away_team: g.away,
        home: g.home, away: g.away,
        spread: g.spread, open_spread: null,
        total: g.total, ml: null, away_ml: null,
        commence_time: g.game_date,
      };
      const sitCtx = {
        homeAts: gameContext.homeAts,
        awayAts: gameContext.awayAts,
        h2h: gameContext.h2h,
        homeRestDays: null,
        awayRestDays: null,
        travelMiles: null,
        timezoneShift: null,
        weather: null,
        homeInjuries: [],
        awayInjuries: [],
      };
      const res = await EDGE_SITUATIONS.evaluateSlate([slateGame], sitCtx);
      if (res && res.length) {
        const sit = res[0];
        const strength = sit.strength || 0;
        const lean = sit.lean;
        const sig = lean === 'home' ? Math.min(strength / 4, 1)
                  : lean === 'away' ? -Math.min(strength / 4, 1)
                  : 0;
        const vote = lean === 'home' ? 'yes' : lean === 'away' ? 'no' : 'neu';
        sitFamily = {
          family: 'situations',
          signal: sig,
          vote,
          confidence: strength > 0 ? Math.min(0.5 + strength * 0.08, 0.9) : 0.5,
          edge: Math.abs(sig) * 0.08,
          reason: (sit.situations || []).slice(0, 3).map(x => x.label).join(' · '),
          subs: sit.situations || [],
          data: sit,
        };
      }
    } catch {}
  }

  const allFamilies = sitFamily ? [sitFamily, ...families] : families;

  // 4. Governor
  const dyn = EDGE_GOVERNOR.getDynamicWeights(sport);
  const merged = { ...dyn, situations: 12 };
  let gov;
  try {
    gov = EDGE_GOVERNOR.run(allFamilies, prior, { dynamicWeights: merged });
  } catch { return null; }

  // 5. Physics
  let phys;
  try {
    phys = EDGE_PHYSICS.decide(gov, prior, {});
  } catch { return null; }

  if (phys.decision === 'PASS' || phys.decision === 'CAPPED' || phys.decision === 'VETOED') {
    return null;
  }
  if (!phys.direction || phys.direction === 'none') return null;

  // ── Grade against the actual final ──
  const margin = g.home_score - g.away_score;
  const coverMarginHome = margin + g.spread;   // spread signed home perspective
  let pickCoverMargin;
  if (phys.direction === 'home') pickCoverMargin = coverMarginHome;
  else pickCoverMargin = -coverMarginHome;

  let result;
  if (Math.abs(pickCoverMargin) < 0.01) result = 'P';
  else if (pickCoverMargin > 0) result = 'W';
  else result = 'L';

  return {
    game_id: g.game_id,
    sport,
    date: (g.game_date || '').slice(0, 10),
    home: g.home,
    away: g.away,
    spread: g.spread,
    final_score: `${g.away_score}-${g.home_score}`,
    final_margin: margin,
    pick_direction: phys.direction,
    pick_side: phys.side_label?.team || phys.direction,
    decision: phys.decision,
    confidence: phys.confidence,
    edge: phys.edge,
    units: phys.units,
    result,
    cover_margin: Math.round(pickCoverMargin * 100) / 100,
    families: allFamilies.map(f => ({
      family: f.family,
      signal: f.signal,
      vote: f.vote,
      confidence: f.confidence,
    })),
    situations: (sitFamily && sitFamily.subs) ? sitFamily.subs : [],
  };
}

// ============================================================
// ── TALLY ──
// ============================================================

function tallyGraded(g) {
  // Per family: did the family's vote match the winning side?
  g.families.forEach(f => {
    if (f.vote === 'neu') return;
    if (!familyStats[f.family]) familyStats[f.family] = { wins: 0, losses: 0, pushes: 0, games: 0 };
    const stat = familyStats[f.family];
    stat.games++;
    const familyPickedHome = f.vote === 'yes';
    const pickerPickedHome = g.pick_direction === 'home';
    // Family is "correct" if it agreed with the winning side,
    // regardless of what physics picked. That measures the
    // family's signal directly, not the pipeline's.
    const margin = g.final_margin;
    const coverHome = (margin + g.spread) > 0.01;
    const pushHome = Math.abs(margin + g.spread) < 0.01;
    if (pushHome) { stat.pushes++; return; }
    const winnerIsHome = coverHome;
    const familyCorrect = (familyPickedHome && winnerIsHome) || (!familyPickedHome && !winnerIsHome);
    if (familyCorrect) stat.wins++;
    else stat.losses++;
  });

  // Per situation: which side it leaned and whether that side covered
  g.situations.forEach(s => {
    if (!s.side || s.side === 'pass') return;
    if (!situationStats[s.id]) situationStats[s.id] = { label: s.label, wins: 0, losses: 0, pushes: 0, games: 0 };
    const stat = situationStats[s.id];
    stat.games++;
    const margin = g.final_margin;
    const coverHome = (margin + g.spread) > 0.01;
    const pushHome = Math.abs(margin + g.spread) < 0.01;
    if (pushHome) { stat.pushes++; return; }
    const winnerIsHome = coverHome;
    const sitHome = s.side === 'home' || s.side === 'favorite';
    const correct = (sitHome && winnerIsHome) || (!sitHome && !winnerIsHome);
    if (correct) stat.wins++;
    else stat.losses++;
  });

  // Per confidence bucket (the pipeline's own pick)
  const conf = g.confidence;
  const bucket = conf >= 75 ? '75+' : conf >= 70 ? '70-74' : conf >= 65 ? '65-69' : conf >= 60 ? '60-64' : conf >= 55 ? '55-59' : '<55';
  if (!confStats[bucket]) confStats[bucket] = { wins: 0, losses: 0, pushes: 0, games: 0 };
  confStats[bucket].games++;
  if (g.result === 'W') confStats[bucket].wins++;
  else if (g.result === 'L') confStats[bucket].losses++;
  else confStats[bucket].pushes++;
}

// ============================================================
// ── REPORT ──
// ============================================================

function renderReport() {
  if (!gameResults.length) {
    out('<div class="empty">No picks produced. Nothing to report.</div>');
    return;
  }

  const w = gameResults.filter(g => g.result === 'W').length;
  const l = gameResults.filter(g => g.result === 'L').length;
  const p = gameResults.filter(g => g.result === 'P').length;
  const settled = w + l;
  const hitRate = settled > 0 ? (w / settled) * 100 : 0;

  // Units at flat 1u per pick
  const flatPnl = gameResults.reduce((s, g) => s + (g.result === 'W' ? 0.91 : g.result === 'L' ? -1 : 0), 0);
  // Break-even at -110 is 52.4%
  const breaksEven = hitRate >= 52.4;

  let html = '';

  // Summary
  html += `
    <div class="summary">
      <div class="sum-cell"><div class="sum-v gold">${gameResults.length}</div><div class="sum-l">Picks</div></div>
      <div class="sum-cell"><div class="sum-v">${w}-${l}-${p}</div><div class="sum-l">W-L-P</div></div>
      <div class="sum-cell"><div class="sum-v ${breaksEven ? 'green' : 'red'}">${hitRate.toFixed(1)}%</div><div class="sum-l">Hit rate</div></div>
      <div class="sum-cell"><div class="sum-v ${flatPnl > 0 ? 'green' : flatPnl < 0 ? 'red' : 'muted'}">${flatPnl > 0 ? '+' : ''}${flatPnl.toFixed(2)}u</div><div class="sum-l">Flat P&L</div></div>
    </div>
  `;

  html += `<div class="sub" style="margin-bottom:20px;">Break-even at -110 juice is 52.4%. ${breaksEven ? 'Above break-even.' : 'Below break-even.'}</div>`;

  // Per family
  const famRows = Object.entries(familyStats)
    .map(([k, v]) => ({ family: k, ...v, rate: v.games > 0 ? v.wins / (v.wins + v.losses) : 0 }))
    .filter(r => r.games >= 10)
    .sort((a, b) => b.rate - a.rate);

  if (famRows.length) {
    html += `<div class="section"><div class="sec-title">BY <em>FAMILY</em></div>`;
    html += `<div class="row head"><span>Family</span><span>Games</span><span>Record</span><span>Rate</span><span>Edge</span></div>`;
    famRows.forEach(r => {
      const total = r.wins + r.losses;
      const rate = total > 0 ? (r.wins / total) * 100 : 0;
      const edge = rate - 52.4;
      const cls = edge > 2 ? 'pos' : edge < -2 ? 'neg' : 'neu';
      html += `<div class="row">
        <span class="name">${r.family}</span>
        <span class="num neu">${r.games}</span>
        <span class="num neu">${r.wins}-${r.losses}-${r.pushes}</span>
        <span class="num ${cls}">${rate.toFixed(1)}%</span>
        <span class="num ${cls}">${edge > 0 ? '+' : ''}${edge.toFixed(1)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Per situation
  const sitRows = Object.entries(situationStats)
    .map(([id, v]) => ({ id, ...v, rate: (v.wins + v.losses) > 0 ? v.wins / (v.wins + v.losses) : 0 }))
    .filter(r => r.games >= 8)
    .sort((a, b) => b.rate - a.rate);

  if (sitRows.length) {
    html += `<div class="section"><div class="sec-title">BY <em>SITUATION</em></div>`;
    html += `<div class="row head"><span>Rule</span><span>Games</span><span>Record</span><span>Rate</span><span>Edge</span></div>`;
    sitRows.forEach(r => {
      const total = r.wins + r.losses;
      const rate = total > 0 ? (r.wins / total) * 100 : 0;
      const edge = rate - 52.4;
      const cls = edge > 3 ? 'pos' : edge < -3 ? 'neg' : 'neu';
      html += `<div class="row">
        <span class="name" style="font-size:11px;">${r.label || r.id}</span>
        <span class="num neu">${r.games}</span>
        <span class="num neu">${r.wins}-${r.losses}-${r.pushes}</span>
        <span class="num ${cls}">${rate.toFixed(1)}%</span>
        <span class="num ${cls}">${edge > 0 ? '+' : ''}${edge.toFixed(1)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Per confidence bucket
  const confOrder = ['75+', '70-74', '65-69', '60-64', '55-59', '<55'];
  const confRows = confOrder.filter(k => confStats[k]).map(k => {
    const v = confStats[k];
    const total = v.wins + v.losses;
    return { bucket: k, ...v, rate: total > 0 ? v.wins / total : 0 };
  });

  if (confRows.length) {
    html += `<div class="section"><div class="sec-title">BY <em>CONFIDENCE</em></div>`;
    html += `<div class="row head"><span>Bucket</span><span>Games</span><span>Record</span><span>Rate</span><span>Edge</span></div>`;
    confRows.forEach(r => {
      const total = r.wins + r.losses;
      const rate = total > 0 ? (r.wins / total) * 100 : 0;
      const edge = rate - 52.4;
      const cls = edge > 2 ? 'pos' : edge < -2 ? 'neg' : 'neu';
      html += `<div class="row">
        <span class="name">${r.bucket}%</span>
        <span class="num neu">${r.games}</span>
        <span class="num neu">${r.wins}-${r.losses}-${r.pushes}</span>
        <span class="num ${cls}">${rate.toFixed(1)}%</span>
        <span class="num ${cls}">${edge > 0 ? '+' : ''}${edge.toFixed(1)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // All games
  html += `<div class="section"><div class="sec-title">ALL <em>PICKS</em></div>`;
  html += `<div class="game-row head"><span>Date</span><span>Matchup</span><span>Spread</span><span>Pick</span><span>Score</span><span>Result</span></div>`;
  gameResults.slice().reverse().forEach(g => {
    const resCls = g.result === 'W' ? 'res-w' : g.result === 'L' ? 'res-l' : 'res-p';
    html += `<div class="game-row">
      <span class="date">${g.date}</span>
      <span class="matchup">${g.away} @ ${g.home}</span>
      <span class="num">${g.spread > 0 ? '+' : ''}${g.spread}</span>
      <span class="side">${g.pick_side}</span>
      <span class="num">${g.final_score}</span>
      <span class="${resCls}">${g.result}</span>
    </div>`;
  });
  html += `</div>`;

  out(html);
}
</script>
